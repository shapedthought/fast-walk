[package]
name = "fast-walk"
version = "0.2.0"
edition = "2021"
description = "Scan a filesystem and report file counts and capacity by extension, age and size"
repository = "https://github.com/shapedthought/fast-walk"
license = "MIT"
readme = "README.md"
keywords = ["filesystem", "storage", "capacity", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
jwalk = "0.8.1"
anyhow = "1.0.58"
csv = "1.1.6"
num_cpus = "1.13.1"
colored = "3.1"
clap = { version = "4.1.6", features = ["derive"] }
comfy-table = "7.2"
emoji = "0.2.1"
indicatif = "0.18"
rayon = "1.6.1"

[dev-dependencies]
tempfile = "3"
